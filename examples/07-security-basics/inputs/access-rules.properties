# 07-security-basics input: example GeoServer data access rules.
# Format: <workspace>.<layer>.<mode>=<role>[,<role>...]
# Modes: r = read, w = write. A layer with NO rule here is NOT locked
# down — the audit script reports it as UNRULED. Add a rule for every
# layer you intend to restrict; do not rely on absence.
# Roles below are examples (ROLE_AUTHENTICATED, ROLE_ADMINISTRATOR are
# GeoServer built-ins; SYNTHETIC_READER is a placeholder role name the
# operator creates if used). Adjust to your own roles before applying.

# Synthetic workspace: readable by any authenticated user.
synthetic.*.r=ROLE_AUTHENTICATED

# Federated workspace: readable only by the placeholder reader role.
federated.*.r=SYNTHETIC_READER

# Admin-only write everywhere in these workspaces.
synthetic.*.w=ROLE_ADMINISTRATOR
federated.*.w=ROLE_ADMINISTRATOR
